<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .title { font-size: 26px; font-weight: 700; fill: #f3f4f6; letter-spacing: -0.4px; }
      .subtitle { font-size: 13.5px; font-weight: 400; fill: #9ca3af; }
      .panel-title { font-size: 15px; font-weight: 600; fill: #e5e7eb; letter-spacing: 0.2px; }
      .panel-unit { font-size: 12px; font-weight: 500; fill: #6b7280; }
      .group-label { font-size: 13.5px; font-weight: 600; fill: #d1d5db; }
      .group-sub { font-size: 11.5px; font-weight: 400; fill: #6b7280; }
      .val-muted { font-size: 12.5px; font-weight: 500; fill: #9ca3af; }
      .val-v38 { font-size: 13.5px; font-weight: 700; fill: #ecfdf5; }
      .pill-text { font-size: 11.5px; font-weight: 700; fill: #6ee7b7; }
      .legend-text { font-size: 12.5px; font-weight: 500; fill: #d1d5db; }
      .axis-label { font-size: 11px; font-weight: 500; fill: #4b5563; }
      .footer-text { font-size: 12px; font-weight: 500; fill: #9ca3af; }
      .footer-strong { font-size: 12px; font-weight: 600; fill: #e5e7eb; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="675" fill="#0b0f14"/>

  <!-- Top Header -->
  <text x="36" y="48" class="sans title">squid5060 v3.8 — Inkling-2-Mini (26.4B MoE) on 8 GB RTX 5060 Laptop</text>
  <text x="36" y="72" class="sans subtitle">Single-stream (c=1) · 7.47 GiB peak (0.22 GiB idle-sleep) · AVX-VNNI + Blackwell TC MoE · 5-Way Adaptive DSpark · Lazy 32K→256K KV</text>

  <!-- Legend Row -->
  <g transform="translate(36, 94)">
    <rect x="0" y="0" width="12" height="12" rx="3" fill="#4b5563"/>
    <text x="20" y="10.5" class="sans legend-text">llama.cpp (tuned + loop fix, UD-Q3_K_XL)</text>

    <rect x="305" y="0" width="12" height="12" rx="3" fill="#34d399"/>
    <text x="325" y="10.5" class="sans legend-text">squid5060 v3.8 (NVFP4 + Q4 KV, 93.5% physical roofline)</text>
  </g>

  <!-- ====================================================================== -->
  <!-- LEFT PANEL: DECODE THROUGHPUT (tok/s)                                  -->
  <!-- Scale: x0 = 64, 2.25 px / tok/s (150 tok/s -> 337.5px -> x=401.5)      -->
  <!-- ====================================================================== -->
  <rect x="36" y="124" width="552" height="482" rx="12" fill="#11161d" stroke="#1f2937" stroke-width="1"/>
  <text x="64" y="156" class="sans panel-title">Decode Speed (Single Stream, c=1)</text>
  <text x="560" y="156" text-anchor="end" class="mono panel-unit">tok/s (higher is better)</text>
  <line x1="64" y1="170" x2="560" y2="170" stroke="#1f2937" stroke-width="1"/>

  <!-- Vertical Gridlines (0, 25, 50, 75, 100, 125, 150 tok/s) -->
  <g stroke="#1c232e" stroke-width="1">
    <line x1="64"    y1="184" x2="64"    y2="572"/>
    <line x1="120.25" y1="184" x2="120.25" y2="572" stroke-dasharray="3 4"/>
    <line x1="176.5"  y1="184" x2="176.5"  y2="572" stroke-dasharray="3 4"/>
    <line x1="232.75" y1="184" x2="232.75" y2="572" stroke-dasharray="3 4"/>
    <line x1="289"    y1="184" x2="289"    y2="572" stroke-dasharray="3 4"/>
    <line x1="345.25" y1="184" x2="345.25" y2="572" stroke-dasharray="3 4"/>
    <line x1="401.5"  y1="184" x2="401.5"  y2="572" stroke-dasharray="3 4"/>
  </g>
  <text x="64"     y="590" text-anchor="middle" class="mono axis-label">0</text>
  <text x="120.25" y="590" text-anchor="middle" class="mono axis-label">25</text>
  <text x="176.5"  y="590" text-anchor="middle" class="mono axis-label">50</text>
  <text x="232.75" y="590" text-anchor="middle" class="mono axis-label">75</text>
  <text x="289"    y="590" text-anchor="middle" class="mono axis-label">100</text>
  <text x="345.25" y="590" text-anchor="middle" class="mono axis-label">125</text>
  <text x="401.5"  y="590" text-anchor="middle" class="mono axis-label">150</text>

  <!-- Group D1: Peak Single-Prompt Decode (c=1) -->
  <g transform="translate(0, 198)">
    <text x="64" y="0" class="sans group-label">Peak Decode (c=1)</text>
    <text x="198" y="0" class="sans group-sub">best SSE prompt · 161.9 Spark-Bench peak</text>

    <!-- llama.cpp: 37.9 -> 85.3px -->
    <rect x="64" y="14" width="85.3" height="20" rx="4" fill="#4b5563"/>
    <text x="157" y="28.5" class="mono val-muted">37.9</text>

    <!-- v3.8: 136.2 -> 306.5px -->
    <rect x="64" y="40" width="306.5" height="22" rx="4" fill="#34d399"/>
    <text x="379" y="55.5" class="mono val-v38">136.2 tok/s</text>
    <rect x="490" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="520" y="55" text-anchor="middle" class="mono pill-text">3.59×</text>
  </g>

  <!-- Group D2: Long-Context Needle Decode (18.8K–30K) -->
  <g transform="translate(0, 326)">
    <text x="64" y="0" class="sans group-label">Long-Context Decode</text>
    <text x="215" y="0" class="sans group-sub">18.8K needle 3/3 · 117.7 tok/s @ 30K 3-depth</text>

    <!-- llama.cpp: 32.1 -> 72.2px -->
    <rect x="64" y="14" width="72.2" height="20" rx="4" fill="#4b5563"/>
    <text x="144" y="28.5" class="mono val-muted">32.1</text>

    <!-- v3.8: 125.9 -> 283.3px -->
    <rect x="64" y="40" width="283.3" height="22" rx="4" fill="#34d399"/>
    <text x="356" y="55.5" class="mono val-v38">125.9 tok/s</text>
    <rect x="467" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="497" y="55" text-anchor="middle" class="mono pill-text">3.92×</text>
  </g>

  <!-- Group D3: 6-Prompt Median (c=1) -->
  <g transform="translate(0, 454)">
    <text x="64" y="0" class="sans group-label">6-Prompt Median (c=1)</text>
    <text x="220" y="0" class="sans group-sub">107.1 T=0 · 103.1 T=0.6 · 102.0 T=1.0</text>

    <!-- llama.cpp: 37.2 -> 83.7px -->
    <rect x="64" y="14" width="83.7" height="20" rx="4" fill="#4b5563"/>
    <text x="156" y="28.5" class="mono val-muted">37.2</text>

    <!-- v3.8: 107.1 -> 241.0px -->
    <rect x="64" y="40" width="241.0" height="22" rx="4" fill="#34d399"/>
    <text x="314" y="55.5" class="mono val-v38">107.1 tok/s</text>
    <rect x="425" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="455" y="55" text-anchor="middle" class="mono pill-text">2.88×</text>
  </g>

  <!-- ====================================================================== -->
  <!-- RIGHT PANEL: COLD PROMPT PREFILL (tok/s)                               -->
  <!-- Scale: x0 = 640, 0.15 px / tok/s (2000 tok/s -> 300px -> x=940)        -->
  <!-- ====================================================================== -->
  <rect x="612" y="124" width="552" height="482" rx="12" fill="#11161d" stroke="#1f2937" stroke-width="1"/>
  <text x="640" y="156" class="sans panel-title">Cold Prompt Prefill (bench.py)</text>
  <text x="1136" y="156" text-anchor="end" class="mono panel-unit">tok/s (higher is better)</text>
  <line x1="640" y1="170" x2="1136" y2="170" stroke="#1f2937" stroke-width="1"/>

  <!-- Vertical Gridlines (0, 500, 1000, 1500, 2000 tok/s -> x = 640, 715, 790, 865, 940) -->
  <g stroke="#1c232e" stroke-width="1">
    <line x1="640" y1="184" x2="640" y2="572"/>
    <line x1="715" y1="184" x2="715" y2="572" stroke-dasharray="3 4"/>
    <line x1="790" y1="184" x2="790" y2="572" stroke-dasharray="3 4"/>
    <line x1="865" y1="184" x2="865" y2="572" stroke-dasharray="3 4"/>
    <line x1="940" y1="184" x2="940" y2="572" stroke-dasharray="3 4"/>
  </g>
  <text x="640" y="590" text-anchor="middle" class="mono axis-label">0</text>
  <text x="715" y="590" text-anchor="middle" class="mono axis-label">500</text>
  <text x="790" y="590" text-anchor="middle" class="mono axis-label">1000</text>
  <text x="865" y="590" text-anchor="middle" class="mono axis-label">1500</text>
  <text x="940" y="590" text-anchor="middle" class="mono axis-label">2000</text>

  <!-- Group P1: 3.3K Cold Prefill -->
  <g transform="translate(0, 198)">
    <text x="640" y="0" class="sans group-label">3.3K Random Prompt</text>
    <text x="790" y="0" class="sans group-sub">cold cache · 19.0s → 3.0s wait</text>

    <!-- llama.cpp: 174 -> 26.1px -->
    <rect x="640" y="14" width="26.1" height="20" rx="4" fill="#4b5563"/>
    <text x="674" y="28.5" class="mono val-muted">174</text>

    <!-- v3.8: 1116 -> 167.4px -->
    <rect x="640" y="40" width="167.4" height="22" rx="4" fill="#34d399"/>
    <text x="816" y="55.5" class="mono val-v38">1,116 tok/s</text>
    <rect x="926" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="956" y="55" text-anchor="middle" class="mono pill-text">6.41×</text>
  </g>

  <!-- Group P2: 12.9K Cold Prefill -->
  <g transform="translate(0, 326)">
    <text x="640" y="0" class="sans group-label">12.9K Random Prompt</text>
    <text x="800" y="0" class="sans group-sub">sm_120a block-scaled TC · 77s → 6.9s</text>

    <!-- llama.cpp: 168 -> 25.2px -->
    <rect x="640" y="14" width="25.2" height="20" rx="4" fill="#4b5563"/>
    <text x="673" y="28.5" class="mono val-muted">168</text>

    <!-- v3.8: 1859 -> 278.9px -->
    <rect x="640" y="40" width="278.9" height="22" rx="4" fill="#34d399"/>
    <text x="928" y="55.5" class="mono val-v38">1,859 tok/s</text>
    <rect x="1038" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="1068" y="55" text-anchor="middle" class="mono pill-text">11.1×</text>
  </g>

  <!-- Group P3: Long-Context Needle Prefill (24K) -->
  <g transform="translate(0, 454)">
    <text x="640" y="0" class="sans group-label">Long-Context Needle (24K)</text>
    <text x="826" y="0" class="sans group-sub">160s → 11.6s · 2,248 peak · 3/3 recall</text>

    <!-- llama.cpp: 149 -> 22.4px -->
    <rect x="640" y="14" width="22.4" height="20" rx="4" fill="#4b5563"/>
    <text x="670" y="28.5" class="mono val-muted">149 (160s)</text>

    <!-- v3.8: 2061 -> 309.2px -->
    <rect x="640" y="40" width="309.2" height="22" rx="4" fill="#34d399"/>
    <text x="958" y="55.5" class="mono val-v38">2,061 tok/s</text>
    <rect x="1068" y="41" width="60" height="20" rx="10" fill="#064e3b" stroke="#065f46" stroke-width="1"/>
    <text x="1098" y="55" text-anchor="middle" class="mono pill-text">13.8×</text>
  </g>

  <!-- Footer Strip -->
  <rect x="36" y="622" width="1128" height="36" rx="8" fill="#11161d" stroke="#1f2937" stroke-width="1"/>
  <text x="600" y="644" text-anchor="middle" class="sans footer-text">
    <tspan class="footer-strong">Spark-Bench:</tspan> 286/295 (GSM8K 97.5% · LC 100%)  ·
    <tspan class="footer-strong">Lazy Context:</tspan> 32K → 256K (240K needle PASS)  ·
    <tspan class="footer-strong">Idle-Sleep:</tspan> 7.47 → 0.22 GiB  ·
    <tspan class="footer-strong">Vision:</tspan> 0 MiB
  </text>
</svg>
