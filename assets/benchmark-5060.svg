    <rect x="215" y="0" width="12" height="12" rx="3" fill="#60a5fa"/>
    <text x="235" y="10.5" class="sans legend-text">squid5060 v3.0 (Hybrid AVX2+GPU)</text>

    <rect x="470" y="0" width="12" height="12" rx="3" fill="#34d399"/>
    <text x="490" y="10.5" class="sans legend-text">squid5060 v3.1 (+ PDL Cluster Attn, sm_120a Block-Scaled Prefill, LoopCD)</text>
  </g>

